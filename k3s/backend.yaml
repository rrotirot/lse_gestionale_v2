apiVersion: apps/v1
kind: Deployment
metadata:
  name: lse-backend
  namespace: lse-gestionale
  labels:
    app: lse-backend
    app.kubernetes.io/name: lse-backend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lse-backend
  template:
    metadata:
      labels:
        app: lse-backend
    spec:
      containers:
        - name: backend
          # Adjust the image name/tag as needed for your container registry (e.g. dockerhub-username/lse-backend:latest)
          image: alexkill536ita/lse-gestionale-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Environment variables mapped from ConfigMap
          envFrom:
            - configMapRef:
                name: lse-config
          
          # Environment variables mapped from Secrets
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: MONGODB_URI
            # REDIS_URL: opzionale. backend/lib/cache.js:14 fa fallback se assente.
            # Se non hai un Redis nel cluster, lascia il secret non definito.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: REDIS_URL
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: API_KEY
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_GUILD_ID

          # Self-healing probes checking the unauthenticated `/api/health` endpoint
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: lse-gestionale
  labels:
    app: lse-backend
    app.kubernetes.io/name: lse-backend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: lse-backend
