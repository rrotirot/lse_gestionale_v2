apiVersion: apps/v1
kind: Deployment
metadata:
  name: lse-frontend
  namespace: lse-gestionale
  labels:
    app: lse-frontend
    app.kubernetes.io/name: lse-frontend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lse-frontend
  template:
    metadata:
      labels:
        app: lse-frontend
    spec:
      containers:
        - name: frontend
          # Adjust the image name/tag as needed for your container registry (e.g. dockerhub-username/lse-frontend:latest)
          image: alexkill536ita/lse-gestionale-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          # Environment variables for the frontend.
          # NEXT_PUBLIC_* è inlinato al build-time nel bundle JS: NON impostarlo qui.
          # Il browser usa URL relativa (vuota) → Traefik instrada /api/* al backend.
          # Il server (SSR / Route Handlers) usa BACKEND_URL via DNS interno cluster.
          env:
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_URL
              value: "http://backend-service:5000"

          # Health checks for frontend deployment
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: lse-gestionale
  labels:
    app: lse-frontend
    app.kubernetes.io/name: lse-frontend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: lse-frontend
