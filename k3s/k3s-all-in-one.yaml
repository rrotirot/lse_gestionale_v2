# =========================================================================
# LSE GESTIONALE V2 - K3S ALL-IN-ONE MANIFEST (COMBINED IMAGE)
# Single container running both Next.js (port 3000) and Express (port 5000)
# Deploy: kubectl apply -f k3s-all-in-one.yaml
# =========================================================================

# ---------------------------------------------------------
# 1. NAMESPACE DEFINITION
# ---------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: lse-gestionale
  labels:
    app.kubernetes.io/name: lse-gestionale
    app.kubernetes.io/part-of: lse-gestionale
---
# ---------------------------------------------------------
# 2. CONFIGMAP - GLOBAL CONFIGURATION
# ---------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: lse-config
  namespace: lse-gestionale
  labels:
    app.kubernetes.io/name: lse-gestionale
    app.kubernetes.io/part-of: lse-gestionale
data:
  # General App Configuration
  NODE_ENV: "production"
  PORT: "5000"
  CORS_ORIGIN: "*"

  # Discord Member Sync Custom Settings
  DISCORD_SYNC_DEFAULT_TAG: "LSE-P"
  DISCORD_SYNC_NAME_SOURCE: "displayName"
---
# ---------------------------------------------------------
# 3. SECRETS - ENCRYPTED CREDENTIALS (BASE64)
# ---------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: lse-secrets
  namespace: lse-gestionale
  labels:
    app.kubernetes.io/name: lse-gestionale
    app.kubernetes.io/part-of: lse-gestionale
type: Opaque
data:
  # External Database Connections
  MONGODB_URI: bW9uZ29kYitzcnY6Ly9tYW56b2FsaXp6aV9kYl91c2VyOmtzeHlxRGk2YkVTcEY3b2tAY2x1c3RlcjAubG16cjJ3OC5tb25nb2RiLm5ldC8/YXBwTmFtZT1DbHVzdGVyMA==
  REDIS_URL: cmVkaXM6Ly9sb2NhbGhvc3Q6NjM3OQ==

  # Security & Authentication keys
  JWT_SECRET: ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudA==
  API_KEY: ZGV2LWFwaS1rZXktZm9yLWRldmVsb3BtZW50

  # Discord Bot Integrations
  DISCORD_BOT_TOKEN: TVRVd05qVTRNVGd4TkRRd01qSXlNREV3TXcuR1YxSllTLmRTaEUzY0U1dG4xOVUtWjJHaDRjR3F4cFd6MmtETkNwX2V1dlk4
  DISCORD_GUILD_ID: MTM1MTMwOTM5MzkwNzY3OTI3Mw==
---
# ---------------------------------------------------------
# 4. COMBINED APP - DEPLOYMENT (FRONTEND + BACKEND)
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lse-app
  namespace: lse-gestionale
  labels:
    app: lse-app
    app.kubernetes.io/name: lse-app
    app.kubernetes.io/part-of: lse-gestionale
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lse-app
  template:
    metadata:
      labels:
        app: lse-app
    spec:
      containers:
        - name: lse-app
          image: alexkill536ita/lse-gestionale:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 5000
              name: backend
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          
          # Environment variables mapped from ConfigMap
          envFrom:
            - configMapRef:
                name: lse-config
          
          # Environment variables mapped from Secrets
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: MONGODB_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: API_KEY
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_GUILD_ID
            # Frontend needs to know the backend URL (localhost since same container)
            - name: NEXT_PUBLIC_RSI_API_URL
              value: "http://localhost:5000"

          # Liveness probe on backend health endpoint
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe on frontend (both services must be up)
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
# ---------------------------------------------------------
# 5. COMBINED APP - SERVICE
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: lse-app-service
  namespace: lse-gestionale
  labels:
    app: lse-app
    app.kubernetes.io/name: lse-app
    app.kubernetes.io/part-of: lse-gestionale
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: frontend
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: backend
  selector:
    app: lse-app
---
# ---------------------------------------------------------
# 6. TRAEFIK INGRESSROUTE - ROUTING TRAFFIC
# ---------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lse-ingress
  namespace: lse-gestionale
  labels:
    app: lse-app
    app.kubernetes.io/name: lse-app
    app.kubernetes.io/part-of: lse-gestionale
spec:
  entryPoints:
    - web
  routes:
    # Route all API traffic to the backend port (higher priority)
    # Change 'lse.local' to your production DNS domain,
    # or remove the Host(`...`) matcher to respond to all hostnames.
    - match: Host(`lse.local`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: lse-app-service
          port: 5000

    # Route all other web traffic (UI, assets) to the frontend port
    - match: Host(`lse.local`) && PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: lse-app-service
          port: 3000
