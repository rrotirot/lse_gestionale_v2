# =========================================================================
# LSE GESTIONALE V2 - K3S ALL-IN-ONE MANIFEST
# Deploy: kubectl apply -f k3s-all-in-one.yaml
# =========================================================================

# ---------------------------------------------------------
# 1. NAMESPACE
# ---------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: lse-gestionale
  labels:
    app.kubernetes.io/name: lse-gestionale
    app.kubernetes.io/part-of: lse-gestionale

---
# ---------------------------------------------------------
# 2. CONFIGMAP
# ---------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: lse-config
  namespace: lse-gestionale
data:
  NODE_ENV: "production"
  PORT: "5000"
  CORS_ORIGIN: "https://lse.alexkill536.duckdns.org"
  DISCORD_SYNC_DEFAULT_TAG: "LSE-P"
  DISCORD_SYNC_NAME_SOURCE: "displayName"

---
# ---------------------------------------------------------
# 3. SECRETS - ENCRYPTED CREDENTIALS (BASE64)
# ---------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: lse-secrets
  namespace: lse-gestionale
  labels:
    app.kubernetes.io/name: lse-gestionale
    app.kubernetes.io/part-of: lse-gestionale
type: Opaque
data:
  # External Database Connections
  MONGODB_URI: bW9uZ29kYitzcnY6Ly9tYW56b2FsaXp6aV9kYl91c2VyOmtzeHlxRGk2YkVTcEY3b2tAY2x1c3RlcjAubG16cjJ3OC5tb25nb2RiLm5ldC8/YXBwTmFtZT1DbHVzdGVyMA==

  # Security & Authentication keys
  JWT_SECRET: ZGV2LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudA==
  API_KEY: ZGV2LWFwaS1rZXktZm9yLWRldmVsb3BtZW50

  # Discord Bot Integrations
  DISCORD_BOT_TOKEN: TVRVd05qVTRNVGd4TkRRd01qSXlNREV3TXcuR1YxSllTLmRTaEUzY0U1dG4xOVUtWjJHaDRjR3F4cFd6MmtETkNwX2V1dlk4
  DISCORD_GUILD_ID: MTM1MTMwOTM5MzkwNzY3OTI3Mw==

---
# ---------------------------------------------------------
# 4. MIDDLEWARE - Redirect HTTP → HTTPS
# ---------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: lse-gestionale
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
# ---------------------------------------------------------
# 5. INGRESSROUTE - HTTP (solo redirect → HTTPS)
# ---------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lse-http
  namespace: lse-gestionale
spec:
  entryPoints:
    - web                  
  routes:
    - match: Host(`lse.alexkill536.duckdns.org`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: frontend-service     # destinazione fittizia, redirect avviene prima
          port: 3000

---
# ---------------------------------------------------------
# 6. INGRESSROUTE - HTTPS (traffico reale)
# ---------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lse-https
  namespace: lse-gestionale
spec:
  entryPoints:
    - websecure
  routes:
    # /api/* → backend Express (NO strip prefix: Express monta le route con /api/...)
    - match: Host(`lse.alexkill536.duckdns.org`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-service
          port: 5000

    # /* → frontend Next.js
    - match: Host(`lse.alexkill536.duckdns.org`)
      kind: Rule
      services:
        - name: frontend-service
          port: 3000

  tls:
    certResolver: duckdns

---
# ---------------------------------------------------------
# 7. BACKEND - DEPLOYMENT
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lse-backend
  namespace: lse-gestionale
  labels:
    app: lse-backend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lse-backend
  template:
    metadata:
      labels:
        app: lse-backend
    spec:
      containers:
        - name: backend
          image: alexkill536ita/lse-gestionale-backend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Variabili non sensibili
          envFrom:
            - configMapRef:
                name: lse-config

          # Variabili sensibili da Secret
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: API_KEY
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: lse-secrets
                  key: DISCORD_GUILD_ID

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

---
# ---------------------------------------------------------
# 8. BACKEND - SERVICE (ClusterIP — mai esposto all'esterno)
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: lse-gestionale
  labels:
    app: lse-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: lse-backend

---
# ---------------------------------------------------------
# 9. FRONTEND - DEPLOYMENT
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lse-frontend
  namespace: lse-gestionale
  labels:
    app: lse-frontend
    app.kubernetes.io/part-of: lse-gestionale
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lse-frontend
  template:
    metadata:
      labels:
        app: lse-frontend
    spec:
      containers:
        - name: frontend
          image: alexkill536ita/lse-gestionale-frontend:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          env:
            - name: NODE_ENV
              value: "production"

            # ── SSR / Server Components ──────────────────────────────
            # DNS interno del cluster: mai visibile al browser.
            # Usalo con: process.env.BACKEND_URL
            - name: BACKEND_URL
              value: "http://backend-service:5000"

            # ── Client-side (browser) ────────────────────────────────
            # NEXT_PUBLIC_* è inlinato nel bundle JS al BUILD-TIME del Dockerfile.
            # Impostarlo qui non ha effetto: il valore client è già stato baked.
            # Build con NEXT_PUBLIC_RSI_API_URL="" → URL relativa → Traefik /api/*.

          # Probe su /api/health (route handler Next.js, vedi src/app/api/health/route.js)
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

---
# ---------------------------------------------------------
# 10. FRONTEND - SERVICE (ClusterIP — mai esposto all'esterno)
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: lse-gestionale
  labels:
    app: lse-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: lse-frontend